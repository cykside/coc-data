name: Sync Upstream & Test

on:
  schedule:
    - cron: "0 2 * * *" # Setiap hari 02:00 UTC (09:00 WIB)
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: https://github.com/chiefpansancolt/clash-of-clans-data.git
  BRANCH: main
  # Penanda bahwa data TH19 sudah masuk di upstream (regex, tidak peka huruf besar/kecil).
  # Spiky Tower = pertahanan baru TH19. Ubah kalau nama di data berbeda.
  MARKER_REGEX: "spiky ?tower"
  ISSUE_TITLE: "Upstream sudah memuat data TH19"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Konfigurasi git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ambil perubahan dari upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$BRANCH"
          BEHIND=$(git rev-list --count HEAD..upstream/$BRANCH)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Fork tertinggal $BEHIND commit dari upstream"

      - name: Cek apakah upstream sudah memuat data TH19
        id: marker
        run: |
          if git grep -qiE "$MARKER_REGEX" upstream/$BRANCH -- data src; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Penanda TH19 ditemukan di upstream"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Penanda TH19 belum ada di upstream"
          fi

      - name: Buat issue pemberitahuan (sekali saja)
        if: steps.marker.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --state all --search "\"$ISSUE_TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "Repo asli (chiefpansancolt/clash-of-clans-data) sekarang memuat data TH19 (penanda: \`$MARKER_REGEX\`). Workflow ini akan menggabungkannya ke fork jika tes dan build lolos. Cek hasil run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Issue pemberitahuan sudah pernah dibuat, dilewati"
          fi

      - name: Merge upstream
        if: steps.fetch.outputs.behind != '0'
        run: git merge upstream/$BRANCH --no-edit

      - name: Setup pnpm
        if: steps.fetch.outputs.behind != '0'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.fetch.outputs.behind != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.fetch.outputs.behind != '0'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.fetch.outputs.behind != '0'
        run: pnpm test

      - name: Build
        if: steps.fetch.outputs.behind != '0'
        run: pnpm build

      - name: Push hasil sinkronisasi
        if: steps.fetch.outputs.behind != '0'
        run: git push origin $BRANCH

      - name: Buat issue jika gagal
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Sinkronisasi upstream gagal ($(date +%F))" \
            --body "Merge, test, atau build gagal. Cek log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
